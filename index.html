<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>旅行计划</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--p:#5B7FFF;--pl:#E8EDFF;--g:#34C759;--gb:#E8F8ED;--o:#FF9500;--ob:#FFF4E5;--r:#FF3B30;--rb:#FFEDEC;--k:#8E8E93;--kb:#F2F2F7;--bg:#F5F6FA;--c:#FFF;--t:#1C1C1E;--t2:#6B7280;--b:#E5E7EB;--rd:14px;--rs:10px;--st:env(safe-area-inset-bottom,0px);--th:56px}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;height:100vh;height:100dvh}
.hdr{background:linear-gradient(135deg,#5B7FFF,#7C5CFC);color:#fff;padding:14px 16px 12px;text-align:center;flex-shrink:0;padding-top:max(14px,env(safe-area-inset-top,14px))}
.hdr h1{font-size:18px;font-weight:700}
.hdr .s{font-size:12px;opacity:.8;margin-top:1px}
.mn{flex:1;overflow:hidden;position:relative}
.pg{display:none;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pg.act{display:flex;flex-direction:column}
.tb{display:flex;background:var(--c);border-top:1px solid var(--b);flex-shrink:0;padding-bottom:var(--st);height:calc(var(--th)+var(--st))}
.ti{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:none;background:none;font-size:10px;color:var(--k);cursor:pointer;padding:4px 0;gap:1px;font-family:inherit}
.ti .ic{font-size:22px;line-height:1.2}
.ti.act{color:var(--p)}
.cd{background:var(--c);border-radius:var(--rd);box-shadow:0 2px 12px rgba(0,0,0,.06);padding:16px;margin-bottom:10px}
.pi{padding:12px;max-width:600px;margin:0 auto;width:100%;flex:1;overflow-y:auto}
.ct{font-size:15px;font-weight:600;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:10px 18px;border:none;border-radius:var(--rs);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer}
.btn:active{transform:scale(.97);opacity:.8}
.btn-p{background:var(--p);color:#fff}
.btn-o{background:none;border:1.5px solid var(--b);color:var(--t2)}
.btn-b{width:100%}
.btn-xs{padding:4px 10px;font-size:11px;border-radius:8px}
input,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--b);border-radius:var(--rs);font-size:15px;font-family:inherit;background:var(--bg);color:var(--t);outline:none}
input:focus,textarea:focus{border-color:var(--p)}
.inl{display:flex;gap:8px}
.inl input{flex:1}

/* Chat */
#pg-chat{padding:0}
.chat{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.chat-in{display:flex;gap:8px;padding:8px 12px;background:var(--c);border-top:1px solid var(--b);flex-shrink:0;padding-bottom:max(8px,var(--st))}
.chat-in input{flex:1;border-radius:20px;padding:9px 14px;font-size:15px}
.chat-in .btn{border-radius:20px;padding:9px 18px;flex-shrink:0}
.nt{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--pl);color:var(--p);margin-right:6px}
.bb{max-width:85%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.5;word-break:break-word}
.ms{align-self:flex-end}
.ms .bb{background:var(--p);color:#fff;border-bottom-right-radius:4px}
.mo{align-self:flex-start}
.mo .bb{background:var(--c);color:var(--t);border:1px solid var(--b);border-bottom-left-radius:4px}
.mr{display:flex;align-items:flex-end;gap:6px;width:100%}
.mm{font-size:11px;color:var(--t2);margin-bottom:2px}
.wc{text-align:center;padding:30px 20px;color:var(--t2);font-size:14px}

/* Plans */
.pl{border:1.5px solid var(--b);border-radius:var(--rs);padding:12px;margin-bottom:10px}
.pn{font-weight:600;font-size:14px}
.pm{font-size:12px;color:var(--t2);margin:2px 0}
.pno{font-size:12px;color:var(--t2);background:var(--kb);padding:6px 10px;border-radius:8px;margin:6px 0}
.vg{display:flex;gap:4px;margin:6px 0;flex-wrap:wrap}
.vb{padding:4px 12px;border:1.5px solid var(--b);border-radius:16px;font-size:12px;background:none;cursor:pointer;font-family:inherit}
.vb.y{color:var(--g);border-color:var(--g)}
.vb.y.act{background:var(--g);color:#fff}
.vb.m{color:var(--o);border-color:var(--o)}
.vb.m.act{background:var(--o);color:#fff}
.vb.n{color:var(--r);border-color:var(--r)}
.vb.n.act{background:var(--r);color:#fff}
.vc{font-size:11px;color:var(--t2)}
.pb{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:11px;margin:1px}
.py{background:var(--gb);color:#1A7D32}
.pm2{background:var(--ob);color:#B87500}
.pn2{background:var(--rb);color:#B81C14}
.ph{display:flex;justify-content:space-between;align-items:flex-start}
.sb{display:flex;gap:3px;height:20px;border-radius:10px;overflow:hidden;margin:6px 0;background:var(--kb)}
.sy{background:var(--g)}
.sm{background:var(--o)}
.sn{background:var(--r)}
.wb{display:inline-block;font-size:10px;background:var(--g);color:#fff;padding:2px 8px;border-radius:10px;margin-left:6px}

/* Members */
.mt{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:16px;font-size:13px;background:var(--pl);color:var(--p);margin:3px}
.mt .rm{cursor:pointer;font-size:15px;opacity:.5}
.mg{display:flex;flex-wrap:wrap;gap:4px}

/* Itinerary */
.di{border-left:3px solid var(--p);padding-left:12px;margin-bottom:14px}
.dt2{font-weight:600;font-size:14px;color:var(--p)}
.ar{display:flex;gap:8px;margin:4px 0;font-size:13px}
.at{min-width:42px;font-weight:600;color:var(--p);font-size:12px;flex-shrink:0}

/* Results */
.sr{display:flex;gap:8px;margin-bottom:10px}
.sb2{flex:1;text-align:center;padding:10px;border-radius:var(--rs);background:var(--kb)}
.sb2 .num{font-size:22px;font-weight:700}
.sb2 .lbl{font-size:11px;color:var(--t2);margin-top:2px}
.sb2.g{background:var(--gb)}.sb2.g .num{color:var(--g)}
.sb2.o{background:var(--ob)}.sb2.o .num{color:var(--o)}
.sb2.p{background:var(--pl)}.sb2.p .num{color:var(--p)}
.od{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);margin-right:4px}
.rt{display:inline-block;font-size:10px;padding:1px 8px;border-radius:8px;background:var(--pl);color:var(--p);margin:1px}

/* Toast */
.tt{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:300;opacity:0;pointer-events:none}
.tt.sh{opacity:1}
.em{text-align:center;padding:24px 16px;color:var(--t2)}
.em .ic2{font-size:40px;margin-bottom:8px}
.em p{font-size:13px;line-height:1.6}
.pa::-webkit-scrollbar,.chat::-webkit-scrollbar{display:none}
@media(min-width:600px){.pi{padding:16px}}
</style>
</head>
<body>
<div class="hdr"><h1>🗺️ 旅行计划</h1><div class="s">实时协作 · 一起商量出行 🎉</div></div>
<div class="mn">
<div class="pg act" id="pg-chat">
<div class="chat" id="chat"><div class="wc"><div style="font-size:40px;margin-bottom:8px;">💬</div><p>欢迎来到旅行计划聊天室！一起商量吧 🎉</p></div></div>
<div class="chat-in"><input type="text" id="ci" placeholder="输入消息..." autocomplete="off"><button class="btn btn-p" id="cs" onclick="sm()">发送</button></div>
</div>
<div class="pg" id="pg-plans">
<div class="pi">
<div class="cd"><div class="ct">🤖 智能推荐</div><p style="font-size:13px;color:var(--t2);margin-bottom:10px;">一键推荐适合的旅行方案</p><button class="btn btn-p btn-b" onclick="ar()" id="recBtn">✨ 智能推荐方案</button></div>
<div class="cd"><div class="ct">📋 出行方案</div><button class="btn btn-p btn-b" onclick="sh('pm')">＋ 添加方案</button></div>
<div id="pl"></div>
</div>
</div>
<div class="pg" id="pg-results"><div class="pi"><div id="ro"></div><div id="rd"></div></div></div>
<div class="pg" id="pg-itin"><div class="pi"><div class="cd"><div class="ct">🗓️ 最终行程</div><p style="font-size:13px;color:var(--t2);margin-bottom:10px;">确定目的地后安排每天的行程</p><button class="btn btn-p btn-b" onclick="sh('dm')">＋ 添加行程日</button></div><div id="il"></div></div></div>
<div class="pg" id="pg-mem"><div class="pi"><div class="cd"><div class="ct">👥 同行伙伴</div><div class="inl" style="margin-bottom:10px;"><input type="text" id="mi" placeholder="输入名字..." onkeydown="if(event.key==='Enter')am()"><button class="btn btn-p" onclick="am()">添加</button></div><div id="ml" class="mg"></div></div><div class="cd"><div class="ct">🟢 在线成员</div><div id="ol" class="mg"><div class="em" style="padding:12px"><p>暂无在线成员</p></div></div></div></div></div>
</div>
<div class="tb">
<button class="ti act" data-p="chat"><span class="ic">💬</span>聊天</button>
<button class="ti" data-p="plans"><span class="ic">📋</span>方案</button>
<button class="ti" data-p="results"><span class="ic">📊</span>结果</button>
<button class="ti" data-p="itin"><span class="ic">🗓️</span>行程</button>
<button class="ti" data-p="mem"><span class="ic">👥</span>伙伴</button>
</div>
<div class="tt" id="tt"></div>

<!-- Name banner (not blocking modal) -->
<div id="nb" style="display:none;background:linear-gradient(135deg,#5B7FFF,#7C5CFC);color:#fff;padding:20px 16px;text-align:center;position:fixed;bottom:0;left:0;right:0;z-index:200;padding-bottom:max(20px,env(safe-area-inset-bottom,0px));animation:slideUp .3s ease">
<div style="font-size:32px;margin-bottom:8px;">👋</div>
<div style="font-size:16px;font-weight:600;margin-bottom:4px;">欢迎来到旅行计划！</div>
<div style="font-size:13px;opacity:.9;margin-bottom:12px;">输入你的名字加入聊天和投票</div>
<div class="inl" style="max-width:300px;margin:0 auto;"><input type="text" id="ni" placeholder="输入名字..." style="background:#fff;border:none;border-radius:20px;"><button class="btn" style="background:#fff;color:#5B7FFF;border-radius:20px;font-weight:600;" onclick="sn()">进入</button></div>
</div>

<!-- Modals -->
<div id="pm" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center;" onclick="if(event.target===this)h('pm')">
<div style="background:var(--c);border-radius:var(--rd) var(--rd) 0 0;padding:20px 16px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding-bottom:max(20px,var(--st));animation:slideUp .2s ease">
<div style="font-size:17px;font-weight:600;margin-bottom:14px">添加出行方案</div>
<div style="margin-bottom:10px"><label style="font-size:12px;color:var(--t2)">方案名称</label><input id="pn" placeholder="例如：洛阳三日游"></div>
<div style="margin-bottom:10px"><label style="font-size:12px;color:var(--t2)">出发日期</label><input type="date" id="pd"></div>
<div style="margin-bottom:10px"><label style="font-size:12px;color:var(--t2)">结束日期</label><input type="date" id="pde"></div>
<div style="margin-bottom:10px"><label style="font-size:12px;color:var(--t2)">目的地</label><input id="pdest" placeholder="例如：洛阳"></div>
<div style="margin-bottom:10px"><label style="font-size:12px;color:var(--t2)">备注</label><textarea id="pnote" rows="3" placeholder="费用预估、出行方式等"></textarea></div>
<div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-o" style="flex:1" onclick="h('pm')">取消</button><button class="btn btn-p" style="flex:1" onclick="ap()">添加</button></div>
</div>
</div>

<div id="dm" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center;" onclick="if(event.target===this)h('dm')">
<div style="background:var(--c);border-radius:var(--rd) var(--rd) 0 0;padding:20px 16px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding-bottom:max(20px,var(--st));animation:slideUp .2s ease">
<div style="font-size:17px;font-weight:600;margin-bottom:14px">添加行程日</div>
<div style="margin-bottom:10px"><label style="font-size:12px;color:var(--t2)">日期</label><input type="date" id="dd"></div>
<div style="margin-bottom:10px"><label style="font-size:12px;color:var(--t2)">标题</label><input id="dt" placeholder="第一天 - 抵达洛阳"></div>
<div style="margin-bottom:10px"><label style="font-size:12px;color:var(--t2)">活动安排</label><textarea id="da" rows="4" placeholder="每行一个活动，如：&#10;09:00 集合出发&#10;12:00 午餐"></textarea></div>
<div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-o" style="flex:1" onclick="h('dm')">取消</button><button class="btn btn-p" style="flex:1" onclick="ad()">添加</button></div>
</div>
</div>

<div id="rm" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center;" onclick="if(event.target===this)h('rm')">
<div style="background:var(--c);border-radius:var(--rd) var(--rd) 0 0;padding:20px 16px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding-bottom:max(20px,var(--st));animation:slideUp .2s ease">
<div style="font-size:17px;font-weight:600;margin-bottom:14px">✨ 智能推荐</div>
<div id="rl" style="text-align:center;padding:20px;color:var(--t2)"><div style="font-size:36px;margin-bottom:10px;">⏳</div><p>正在为你推荐方案...</p></div>
<div id="rr" style="display:none"><p style="font-size:13px;color:var(--t2);margin-bottom:12px;">点击下方方案一键添加 👇</p><div id="rcl"></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-o" style="flex:1" onclick="h('rm')">关闭</button><button class="btn btn-p" style="flex:1" onclick="ar()">🔄 换一批</button></div></div>
</div>
</div>

<script>
// Load Firebase with fallback
var db = null;
var fbReady = false;
var offlineMode = false;
var localData = { members: {}, plans: {}, votes: {}, itinerary: {}, messages: [], online: {} };
var myName = localStorage.getItem('tn') || '';

try {
  // Try loading Firebase
  var s = document.createElement('script');
  s.src = 'https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js';
  s.onload = function() {
    var s2 = document.createElement('script');
    s2.src = 'https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js';
    s2.onload = function() {
      try {
        firebase.initializeApp({
          apiKey: "AIzaSyBMdduAkyVSdvz3sXtlB3jAW7L_yhin2VQ",
          authDomain: "travel-planner-2b162.firebaseapp.com",
          databaseURL: "https://travel-planner-2b162-default-rtdb.firebaseio.com",
          projectId: "travel-planner-2b162",
          storageBucket: "travel-planner-2b162.firebasestorage.app",
          messagingSenderId: "20555551861",
          appId: "1:20555551861:web:375a0d4cd15363f7da143c"
        });
        db = firebase.database();
        fbReady = true;
        console.log('Firebase ready');
        initApp();
      } catch(e) {
        console.log('Firebase init error:', e);
        offlineMode = true;
        initApp();
      }
    };
    s2.onerror = function() { offlineMode = true; initApp(); };
    document.body.appendChild(s2);
  };
  s.onerror = function() { offlineMode = true; initApp(); };
  document.body.appendChild(s);
} catch(e) {
  offlineMode = true;
}

// ====== Local Storage fallback ======
function saveLocal() { try { localStorage.setItem('td', JSON.stringify(localData)); } catch(e) {} }
function loadLocal() { try { var d = localStorage.getItem('td'); if (d) localData = JSON.parse(d); } catch(e) {} }

// ====== Toast ======
var _tt;
function toast(m){var t=document.getElementById('tt');t.textContent=m;t.classList.add('sh');clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove('sh')},2000)}

// ====== Helpers ======
function sh(id){document.getElementById(id).style.display='flex'}
function h(id){document.getElementById(id).style.display='none'}
function esc(t){if(!t)return'';var d=document.createElement('div');d.textContent=t;return d.innerHTML}

// ====== Tab switching ======
document.querySelectorAll('.ti').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.ti').forEach(function(x){x.classList.remove('act')});
    document.querySelectorAll('.pg').forEach(function(x){x.classList.remove('act')});
    this.classList.add('act');
    document.getElementById('pg-'+this.dataset.p).classList.add('act');
  });
});

// ====== Name ======
function sn(){
  var n=document.getElementById('ni').value.trim();
  if(!n){toast('请输入名字');return}
  myName=n;
  localStorage.setItem('tn',n);
  document.getElementById('nb').style.display='none';
  if(fbReady){
    db.ref('members').once('value',function(s){var ms=s.val()||{};if(!ms[n])db.ref('members/'+n).set(true)});
    var or=db.ref('online/'+n);or.set(true);or.onDisconnect().remove();
    setInterval(function(){db.ref('online/'+n).set(true)},30000);
  } else {
    localData.members[n]=true;
    saveLocal();
  }
  toast('欢迎, '+n+'!');
}

if(!myName){
  document.getElementById('nb').style.display='block';
} else if(fbReady) {
  var or=db.ref('online/'+myName);or.set(true);or.onDisconnect().remove();
  setInterval(function(){db.ref('online/'+myName).set(true)},30000);
}

// ====== Chat ======
document.getElementById('ci').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sm()}});

function sm(){
  if(!myName){document.getElementById('nb').style.display='block';return}
  var t=document.getElementById('ci').value.trim();
  if(!t)return;
  document.getElementById('ci').value='';
  if(fbReady){
    db.ref('messages').push({name:myName,text:t,time:Date.now()});
  } else {
    localData.messages.push({name:myName,text:t,time:Date.now()});
    saveLocal();
    renderLocalChat();
  }
}

// ====== Init ======
function initApp(){
  if(fbReady){
    // Firebase listeners
    db.ref('messages').orderByKey().limitToLast(200).on('child_added',function(s){
      var m=s.val();renderMsg(m);
    });
    db.ref('members').on('value',function(s){
      var ms=s.val()||{};renderMembers(Object.keys(ms));
    });
    db.ref('online').on('value',function(s){var ol=s.val()||{};renderOnline(Object.keys(ol))});
    db.ref('plans').on('value',function(s){renderPlans(s.val()||{})});
    db.ref('confirmedPlan').on('value',function(s){window._cf=s.val()});
    db.ref('itinerary').orderByChild('date').on('value',function(s){renderItin(s.val()||{})});
    db.ref('plans').on('value',function(){renderResults()});
  } else {
    loadLocal();
    // Render local data
    localData.messages.forEach(function(m){renderMsg(m)});
    renderMembers(Object.keys(localData.members||{}));
    renderPlans(localData.plans||{});
    renderItin(localData.itinerary||{});
  }
}

function renderMsg(m){
  var el=document.getElementById('chat');
  var wc=el.querySelector('.wc');if(wc)wc.remove();
  var self=m.name===myName;
  var d=document.createElement('div');d.className='mr '+(self?'ms':'mo');
  var t=m.time?new Date(m.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'';
  d.innerHTML='<div style="max-width:85%;"><div class="mm">'+(self?'':'<span class="nt">'+esc(m.name)+'</span>')+t+'</div><div class="bb">'+esc(m.text)+'</div></div>';
  el.appendChild(d);
  setTimeout(function(){el.scrollTop=el.scrollHeight},50);
}

function renderMembers(ms){
  var el=document.getElementById('ml');
  if(ms.length===0){el.innerHTML='<div class="em" style="padding:8px"><p>还没有添加伙伴</p></div>';return}
  el.innerHTML=ms.map(function(n){return'<span class="mt">'+esc(n)+'<span class="rm" onclick="rm2(\''+esc(n)+'\')">×</span></span>'}).join('');
  window._mem=ms;
}

function renderOnline(ns){
  var el=document.getElementById('ol');
  if(ns.length===0){el.innerHTML='<div class="em" style="padding:8px"><p>暂无在线成员</p></div>';return}
  el.innerHTML=ns.map(function(n){return'<span class="mt"><span class="od"></span>'+esc(n)+'</span>'}).join('');
}

function am(){
  if(!myName){document.getElementById('nb').style.display='block';return}
  var i=document.getElementById('mi');var n=i.value.trim();
  if(!n){toast('请输入名字');return}
  if(fbReady){

// ====== Plans ======
function ap(){
  if(!myName){document.getElementById('nb').style.display='block';return}
  var n=document.getElementById('pn').value.trim();var d=document.getElementById('pd').value;var de=document.getElementById('pde').value;var ds=document.getElementById('pdest').value.trim();var nt=document.getElementById('pnote').value.trim();

  var data={name:n,date:d,dateEnd:de,dest:ds,note:nt,createdBy:myName,createdAt:Date.now()};
  if(fbReady){
    var r=db.ref('plans').push();r.set(data);db.ref('votes/'+r.key).set({});

function v(pid,vl){
  if(!myName){document.getElementById('nb').style.display='block';return}
  if(fbReady){
    var r=db.ref('votes/'+pid+'/'+myName);
    r.once('value',function(s){if(s.val()===vl)r.remove();else r.set(vl)});
  } else {
    localData.votes=localData.votes||{};localData.votes[pid]=localData.votes[pid]||{};
    if(localData.votes[pid][myName]===vl)delete localData.votes[pid][myName];
    else localData.votes[pid][myName]=vl;
    saveLocal();renderPlans(localData.plans);
  }
}

function dp(pid,pn){

  if(fbReady){db.ref('plans/'+pid).remove();db.ref('votes/'+pid).remove()}else{delete localData.plans[pid];delete localData.votes[pid];saveLocal();renderPlans(localData.plans)}

function cp(pid){

function renderPlans(plans){
  var el=document.getElementById('pl');var pids=Object.keys(plans);
  if(pids.length===0){el.innerHTML='<div class="em"><div class="ic2">📭</div><p>还没有出行方案</p></div>';return}
  var h='';var _cf=window._cf||null;
  pids.forEach(function(pid){
    var p=plans[pid];var vs=(fbReady?{}:(localData.votes||{})[pid])||{};
    h+='<div class="pl" id="pl-'+pid+'"><div class="ph"><div><div class="pn">'+esc(p.name)+(pid===_cf?' <span class="wb">🏆 最终方案</span>':'')+'</div><div class="pm">'+(p.date?'📅 '+p.date+(p.dateEnd?' ~ '+p.dateEnd:'')+' ':'')+(p.dest?'📍 '+esc(p.dest):'')+'</div></div><div style="display:flex;gap:4px;flex-shrink:0;"><button class="btn btn-xs btn-o" onclick="cp(\''+pid+'\')">✅</button><button class="btn btn-xs btn-o" onclick="dp(\''+pid+'\',\''+esc(p.name)+'\')">✕</button></div></div>'+(p.note?'<div class="pno">💡 '+esc(p.note)+'</div>':'')+'<div class="vg" id="vg-'+pid+'"><button class="vb y" onclick="v(\''+pid+'\',\'yes\')">✅ 可以</button><button class="vb m" onclick="v(\''+pid+'\',\'maybe\')">🤔 再看看</button><button class="vb n" onclick="v(\''+pid+'\',\'no\')">❌ 不行</button></div><div class="sb" id="sb-'+pid+'"></div><div class="vc" id="vc-'+pid+'"></div><div id="vr-'+pid+'"></div></div>';
  });
  el.innerHTML=h;
  // Update votes (for local mode)
  if(!fbReady&&localData.votes){
    pids.forEach(function(pid){updateVoteUI2(pid,(localData.votes||{})[pid]||{})});
  }
}

function updateVoteUI2(pid,vs){
  var mem=window._mem||[];var t=mem.length||1;var y=0,m=0,n=0;
  Object.values(vs).forEach(function(x){if(x==='yes')y++;else if(x==='maybe')m++;else if(x==='no')n++});
  var mv=vs[myName]||'';
  document.querySelectorAll('#vg-'+pid+' .vb').forEach(function(b){
    b.classList.remove('act');
    if((b.classList.contains('y')&&mv==='yes')||(b.classList.contains('m')&&mv==='maybe')||(b.classList.contains('n')&&mv==='no'))b.classList.add('act');
  });
  var sb=document.getElementById('sb-'+pid);if(sb)sb.innerHTML=(y>0?'<div class="sy" style="width:'+(y/t*100)+'%"></div>':'')+(m>0?'<div class="sm" style="width:'+(m/t*100)+'%"></div>':'')+(n>0?'<div class="sn" style="width:'+(n/t*100)+'%"></div>':'')+(y+m+n===0?'<div style="width:100%"></div>':'');
  var vc=document.getElementById('vc-'+pid);if(vc){var p=t>0?Math.round(y/t*100):0;vc.innerHTML='✅ '+y+' · 🤔 '+m+' · ❌ '+n+' · 共'+t+'人 · '+p+'%可去'}
  var vr=document.getElementById('vr-'+pid);if(vr)vr.innerHTML=Object.keys(vs).map(function(nm){var x=vs[nm];var c=x==='yes'?'py':x==='maybe'?'pm2':'pn2';var i=x==='yes'?'✅':x==='maybe'?'🤔':'❌';return'<span class="pb '+c+'">'+i+' '+esc(nm)+'</span>'}).join('');
}

// Listen votes in Firebase mode
if(fbReady){
  // This would be attached when plans load
  var _voteListeners={};
  db.ref('plans').on('value',function(s){
    var plans=s.val()||{};
    Object.keys(plans).forEach(function(pid){
      if(!_voteListeners[pid]){

  });
}

function ad(){
  if(!myName){document.getElementById('nb').style.display='block';return}
  var date=document.getElementById('dd').value;var title=document.getElementById('dt').value.trim();var acts=document.getElementById('da').value.trim();
  if(!title){toast('请填写标题');return}
  var data={date:date,title:title,activities:acts,createdBy:myName,createdAt:Date.now()};
  if(fbReady){db.ref('itinerary').push(data)}else{var id='d'+Date.now();localData.itinerary[id]=data;saveLocal();renderItin(localData.itinerary)}
  document.getElementById('dd').value='';document.getElementById('dt').value='';document.getElementById('da').value='';h('dm');toast('行程已添加！');
}

function renderItin(days){
  var el=document.getElementById('il');var dids=Object.keys(days);
  if(dids.length===0){el.innerHTML='<div class="cd em"><div class="ic2">🗓️</div><p>还没有行程安排</p></div>';return}
  var s=dids.sort(function(a,b){return(days[a].date||'').localeCompare(days[b].date||'')});
  el.innerHTML=s.map(function(did,idx){var d=days[did];var acts=d.activities?d.activities.split('\n').filter(function(l){return l.trim()}).map(function(line){var m=line.match(/^(\d{1,2}:\d{2})\s*(.*)/);if(m)return'<div class="ar"><div class="at">'+m[1]+'</div><div>'+esc(m[2])+'</div></div>';return'<div class="ar"><div class="at"></div><div>'+esc(line)+'</div></div>'}).join(''):'<div style="color:var(--t2);font-size:13px;">暂无安排</div>';return'<div class="cd"><div style="display:flex;justify-content:space-between;align-items:flex-start;"><div class="di" style="border:none;padding:0;flex:1;"><div class="dt2">'+(d.date?'📅 '+d.date:'第'+(idx+1)+'天')+'</div><div style="font-weight:600;margin:4px 0 8px;">'+esc(d.title)+'</div>'+acts+'</div><button class="btn btn-xs btn-o" onclick="dd2(\''+did+'\')">✕</button></div></div>'}).join('');
  el.innerHTML+='<div style="text-align:center;padding:8px 0;"><button class="btn btn-sm btn-o" onclick="cd2()">🗑️ 清空所有行程</button></div>';
}

function dd2(did){if(!confirm('确定删除这一天吗？'))return;if(fbReady){db.ref('itinerary/'+did).remove()}else{delete localData.itinerary[did];saveLocal();renderItin(localData.itinerary)}toast('已删除')}
function cd2(){if(!confirm('确定清空所有行程吗？'))return;if(fbReady){db.ref('itinerary').remove()}else{localData.itinerary={};saveLocal();renderItin({})}toast('已清空')}
