<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>旅行计划</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6fa;color:#1c1c1e;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;height:100vh;height:100dvh}
header{background:linear-gradient(135deg,#5B7FFF,#7C5CFC);color:#fff;padding:14px 16px 12px;text-align:center;flex-shrink:0;padding-top:max(14px,env(safe-area-inset-top,14px))}
header h1{font-size:18px;font-weight:700}
header .sub{font-size:12px;opacity:.8;margin-top:1px}
main{flex:1;overflow:auto;padding:12px;max-width:600px;margin:0 auto;width:100%}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
h2{font-size:15px;font-weight:600;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border:none;border-radius:10px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;background:#5B7FFF;color:#fff;width:100%}
.btn:active{opacity:.8}
.btn-o{background:none;border:1.5px solid #E5E7EB;color:#6B7280}
input,textarea{width:100%;padding:10px 12px;border:1.5px solid #E5E7EB;border-radius:10px;font-size:15px;font-family:inherit;background:#f5f6fa;color:#1c1c1e;outline:none;margin-bottom:10px}
input:focus,textarea:focus{border-color:#5B7FFF;background:#fff}
textarea{resize:vertical;min-height:50px}
.row{display:flex;gap:8px}
.row input{flex:1;margin-bottom:0}
.inl{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:16px;font-size:13px;background:#E8EDFF;color:#5B7FFF}
.rm{cursor:pointer;opacity:.5;font-size:15px}
#chatarea{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.5;word-break:break-word}
.s{background:#5B7FFF;color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.o{background:#fff;color:#1c1c1e;border:1px solid #E5E7EB;border-bottom-left-radius:4px;align-self:flex-start}
.plan{border:1.5px solid #E5E7EB;border-radius:10px;padding:12px;margin-bottom:10px}
.pn{font-weight:600;font-size:14px}
.pm{font-size:12px;color:#6B7280;margin:2px 0}
.pno{font-size:12px;color:#6B7280;background:#F2F2F7;padding:6px 10px;border-radius:8px;margin:6px 0}
.vg{display:flex;gap:4px;margin:6px 0;flex-wrap:wrap}
.vb{padding:4px 12px;border:1.5px solid #E5E7EB;border-radius:16px;font-size:12px;background:none;cursor:pointer;font-family:inherit}
.vb:active{opacity:.6}
.vby{color:#34C759;border-color:#34C759}
.vby.on{background:#34C759;color:#fff}
.vbm{color:#FF9500;border-color:#FF9500}
.vbm.on{background:#FF9500;color:#fff}
.vbn{color:#FF3B30;border-color:#FF3B30}
.vbn.on{background:#FF3B30;color:#fff}
.vc{font-size:11px;color:#6B7280;margin-top:4px}
.bar{display:flex;gap:3px;height:20px;border-radius:10px;overflow:hidden;margin:6px 0;background:#F2F2F7}
.bg{background:#34C759}
.bo{background:#FF9500}
.br{background:#FF3B30}
.wb{display:inline-block;font-size:10px;background:#34C759;color:#fff;padding:2px 8px;border-radius:10px;margin-left:6px}
.di{border-left:3px solid #5B7FFF;padding-left:12px;margin-bottom:14px}
.dt{font-weight:600;font-size:14px;color:#5B7FFF}
.ar{display:flex;gap:8px;margin:4px 0;font-size:13px}
.at{min-width:42px;font-weight:600;color:#5B7FFF;font-size:12px;flex-shrink:0}
.sb{flex:1;text-align:center;padding:10px;border-radius:10px;background:#F2F2F7}
.sb .n{font-size:22px;font-weight:700}
.sb .l{font-size:11px;color:#6B7280;margin-top:2px}
.sbg{background:#E8F8ED}.sbg .n{color:#34C759}
.sbo{background:#FFF4E5}.sbo .n{color:#FF9500}
.sbp{background:#E8EDFF}.sbp .n{color:#5B7FFF}
.od{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34C759;margin-right:4px}
.tt{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:300;opacity:0;pointer-events:none;transition:opacity .2s}
.tt.on{opacity:1}
.em{text-align:center;padding:24px;color:#6B7280;font-size:14px}
nav{display:flex;background:#fff;border-top:1px solid #E5E7EB;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:none;background:none;font-size:10px;color:#8E8E93;cursor:pointer;padding:4px 0;font-family:inherit}
nav button .ic{font-size:22px}
nav button.act{color:#5B7FFF}
.pg{display:none;flex-direction:column;flex:1;overflow:hidden}
.pg.act{display:flex}
.md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center}
.md.on{display:flex}
.mc{background:#fff;border-radius:14px 14px 0 0;padding:20px 16px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
.mc h3{font-size:17px;font-weight:600;margin-bottom:14px}
.mc label{font-size:12px;color:#6B7280}
.ma{display:flex;gap:8px;margin-top:14px}
.ma .btn{flex:1}
.rt{display:inline-block;font-size:10px;padding:1px 8px;border-radius:8px;background:#E8EDFF;color:#5B7FFF}
.nt{font-size:11px;padding:2px 8px;border-radius:10px;background:#E8EDFF;color:#5B7FFF;margin-right:6px}
@media(min-width:600px){main{padding:16px}}
</style>
</head>
<body>
<header><h1>🗺️ 旅行计划</h1><div class="sub">实时协作 · 一起商量出行 🎉</div></header>

<div class="pg act" id="pchat">
<div id="chatarea" style="flex:1;overflow-y:auto;padding:10px 12px"><div class="em">💬<br><br>欢迎来到旅行计划聊天室！一起商量吧 🎉</div></div>
<div class="row" style="padding:8px 12px;background:#fff;border-top:1px solid #E5E7EB;flex-shrink:0;margin-bottom:0"><input type="text" id="ci" placeholder="输入消息..." autocomplete="off"><button class="btn" style="width:auto;border-radius:20px;padding:9px 18px;flex-shrink:0" onclick="sm()">发送</button></div>
</div>

<div class="pg" id="pplans">
<main>
<div class="card"><h2>🤖 智能推荐</h2><p style="font-size:13px;color:#6B7280;margin-bottom:10px">一键推荐适合的旅行方案</p><button class="btn" onclick="ar()">✨ 智能推荐方案</button></div>
<div class="card"><h2>📋 出行方案</h2><button class="btn" onclick="om()">＋ 添加方案</button></div>
<div id="plans"></div>
</main>
</div>

<div class="pg" id="presults"><main><div id="ro"></div><div id="rd"></div></main></div>

<div class="pg" id="pitin"><main><div class="card"><h2>🗓️ 最终行程</h2><button class="btn" onclick="odm()">＋ 添加行程日</button></div><div id="itin"></div></main></div>

<div class="pg" id="pmem"><main>
<div class="card"><h2>👥 同行伙伴</h2><div class="row" style="margin-bottom:10px"><input type="text" id="mi" placeholder="输入名字..." style="margin-bottom:0"><button class="btn" style="width:auto;flex-shrink:0;padding:10px 14px" onclick="am()">添加</button></div><div id="ml" class="inl"></div></div>
<div class="card"><h2>🟢 在线成员</h2><div id="ol"><div class="em" style="padding:12px">暂无在线成员</div></div></div>
<div class="card" id="namecard"><h2>👋 设置名字</h2><p style="font-size:13px;color:#6B7280;margin-bottom:8px">输入名字后即可参与聊天和投票</p><div class="row"><input type="text" id="ni" placeholder="输入你的名字..." style="margin-bottom:0"><button class="btn" style="width:auto;flex-shrink:0;padding:10px 14px" onclick="sn()">确定</button></div></div>
</main></div>

<div id="nb" style="display:none;background:#5B7FFF;color:#fff;text-align:center;padding:10px;flex-shrink:0;font-size:13px">👋 请先在「伙伴」页面设置你的名字</div>

<nav>
<button class="act" data-tab="chat"><span class="ic">💬</span>聊天</button>
<button data-tab="plans"><span class="ic">📋</span>方案</button>
<button data-tab="results"><span class="ic">📊</span>结果</button>
<button data-tab="itin"><span class="ic">🗓️</span>行程</button>
<button data-tab="mem"><span class="ic">👥</span>伙伴</button>
</nav>

<div class="tt" id="tt"></div>

<div class="md" id="mp"><div class="mc">
<h3>添加出行方案</h3>
<label>方案名称</label><input id="pn" placeholder="例如：洛阳三日游">
<label>出发日期</label><input type="date" id="pd">
<label>结束日期</label><input type="date" id="pde">
<label>目的地</label><input id="pdest" placeholder="例如：洛阳">
<label>备注</label><textarea id="pnote" rows="2" placeholder="费用预估等"></textarea>
<div class="ma"><button class="btn btn-o" onclick="cm('mp')">取消</button><button class="btn" onclick="ap()">添加</button></div>
</div></div>

<div class="md" id="md"><div class="mc">
<h3>添加行程日</h3>
<label>日期</label><input type="date" id="dd">
<label>标题</label><input id="dt" placeholder="第一天 - 抵达洛阳">
<label>活动安排</label><textarea id="da" rows="3" placeholder="09:00 集合出发&#10;12:00 午餐"></textarea>
<div class="ma"><button class="btn btn-o" onclick="cm('md')">取消</button><button class="btn" onclick="ad()">添加</button></div>
</div></div>

<div class="md" id="mr"><div class="mc">
<h3>✨ 智能推荐</h3>
<div id="rldiv" style="text-align:center;padding:20px;color:#6B7280"><div style="font-size:36px;margin-bottom:10px">⏳</div><p>正在为你推荐方案...</p></div>
<div id="rrdiv" style="display:none"><div id="rclist"></div>
<div class="ma"><button class="btn btn-o" onclick="cm('mr')">关闭</button><button class="btn" onclick="ar()">🔄 换一批</button></div></div>
</div></div>

<script>
var myName = localStorage.getItem('tn') || '';
var mems = [];
var plans = {};
var votes = {};
var itins = {};
var confirmed = null;

function $(id) { return document.getElementById(id); }

function toast(msg) {
  var t = $('tt');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(function() { t.classList.remove('on'); }, 2000);
}

function escapeHTML(t) {
  if (!t) return '';
  var d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

function om() { $('mp').classList.add('on'); }
function odm() { $('md').classList.add('on'); }
function cm(id) { $(id).classList.remove('on'); }

$('mp').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('on'); });
$('md').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('on'); });
$('mr').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('on'); });

// Tab switching
var tabs = document.querySelectorAll('nav button');
for (var i = 0; i < tabs.length; i++) {
  (function(btn) {
    btn.addEventListener('click', function() {
      var sel = document.querySelectorAll('nav button.act');
      for (var j = 0; j < sel.length; j++) sel[j].classList.remove('act');
      var pages = document.querySelectorAll('.pg.act');
      for (var k = 0; k < pages.length; k++) pages[k].classList.remove('act');
      btn.classList.add('act');
      var id = btn.getAttribute('data-tab');
      $('p' + id).classList.add('act');
      if (id === 'results') renderResults();
    });
  })(tabs[i]);
}

if (!myName) { $('nb').style.display = 'block'; }

function sn() {
  var n = $('ni').value.trim();
  if (!n) { toast('请输入名字'); return; }
  myName = n;
  localStorage.setItem('tn', n);
  $('nb').style.display = 'none';
  var found = false;
  for (var i = 0; i < mems.length; i++) { if (mems[i] === n) { found = true; break; } }
  if (!found) { mems.push(n); renderMembers(); }
  toast('欢迎, ' + n + '!');
}

$('ci').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sm(); }
});

function sm() {
  if (!myName) { $('nb').style.display = 'block'; return; }
  var t = $('ci').value.trim();
  if (!t) return;
  $('ci').value = '';
  renderChatMsg({ name: myName, text: t, time: Date.now() });
}

function renderChatMsg(m) {
  var el = $('chatarea');
  var e = el.querySelector('.em');
  if (e) e.remove();
  var self = (m.name === myName);
  var d = document.createElement('div');
  d.style.cssText = 'margin-bottom:4px;display:flex;flex-direction:column;' + (self ? 'align-items:flex-end' : 'align-items:flex-start');
  var ts = m.time ? new Date(m.time).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '';
  var meta = document.createElement('div');
  meta.style.cssText = 'font-size:11px;color:#6B7280;margin-bottom:2px';
  if (!self) {
    var sp = document.createElement('span');
    sp.className = 'nt';
    sp.textContent = m.name;
    meta.appendChild(sp);
  }
  meta.appendChild(document.createTextNode(ts));
  d.appendChild(meta);
  var b = document.createElement('div');
  b.className = 'msg ' + (self ? 's' : 'o');
  b.textContent = m.text;
  d.appendChild(b);
  el.appendChild(d);
  setTimeout(function() { el.scrollTop = el.scrollHeight; }, 50);
}

function am() {
  if (!myName) { $('nb').style.display = 'block'; return; }
  var n = $('mi').value.trim();
  if (!n) { toast('请输入名字'); return; }
  for (var i = 0; i < mems.length; i++) { if (mems[i] === n) { toast('已存在'); return; } }
  mems.push(n);
  $('mi').value = '';
  renderMembers();
  toast('已添加 ' + n);
}

function removeMember(n) {
  if (!confirm('移除 ' + n + ' 吗？')) return;
  var nm = [];
  for (var i = 0; i < mems.length; i++) { if (mems[i] !== n) nm.push(mems[i]); }
  mems = nm;
  renderMembers();
}

function renderMembers() {
  var el = $('ml');
  if (mems.length === 0) { el.innerHTML = '<div class="em" style="padding:8px">还没有伙伴</div>'; return; }
  var h = '';
  for (var i = 0; i < mems.length; i++) {
    h += '<span class="tag">' + escapeHTML(mems[i]) + '<span class="rm" onclick="removeMember(\'' + escapeHTML(mems[i]) + '\')">×</span></span>';
  }
  el.innerHTML = h;
}

function ap() {
  if (!myName) { $('nb').style.display = 'block'; return; }
  var name = $('pn').value.trim();
  if (!name) { toast('请填写方案名称'); return; }
  var id = 'p' + Date.now();
  plans[id] = { name: name, date: $('pd').value, dateEnd: $('pde').value, dest: $('pdest').value.trim(), note: $('pnote').value.trim(), createdBy: myName, createdAt: Date.now() };
  votes[id] = {};
  $('pn').value = ''; $('pd').value = ''; $('pde').value = ''; $('pdest').value = ''; $('pnote').value = '';
  cm('mp');
  renderPlans();
  toast('方案添加成功！');
}

function deletePlan(id) {
  if (!confirm('删除此方案吗？')) return;
  delete plans[id]; delete votes[id];
  renderPlans();
}

function confirmPlan(id) {
  confirmed = id;
  renderPlans();
  toast('已标记为最终方案！');
}

function vote(id, value) {
  if (!myName) { $('nb').style.display = 'block'; return; }
  if (!votes[id]) votes[id] = {};
  if (votes[id][myName] === value) { delete votes[id][myName]; }
  else { votes[id][myName] = value; }
  renderPlans();
}

function renderPlans() {
  var el = $('plans');
  var ids = Object.keys(plans);
  if (ids.length === 0) { el.innerHTML = '<div class="em">📭<br><br>还没有出行方案</div>'; return; }
  ids.sort(function(a, b) { return (plans[b].createdAt || 0) - (plans[a].createdAt || 0); });
  var h = '';
  for (var i = 0; i < ids.length; i++) {
    var id = ids[i];
    var p = plans[id];
    var vs = votes[id] || {};
    var total = mems.length || 1;
    var yes = 0, maybe = 0, no = 0;
    var vnames = Object.keys(vs);
    for (var v = 0; v < vnames.length; v++) {
      var val = vs[vnames[v]];
      if (val === 'yes') yes++; else if (val === 'maybe') maybe++; else if (val === 'no') no++;
    }
    var pct = Math.round(yes / total * 100);
    var isC = (id === confirmed);
    h += '<div class="plan" style="' + (isC ? 'border-color:#34C759;background:#E8F8ED' : '') + '">';
    h += '<div style="display:flex;justify-content:space-between">';
    h += '<div><div class="pn">' + escapeHTML(p.name) + (isC ? ' <span class="wb">🏆</span>' : '') + '</div>';
    h += '<div class="pm">';
    if (p.date) h += '📅 ' + p.date + (p.dateEnd ? ' ~ ' + p.dateEnd : '');
    if (p.dest) h += ' 📍 ' + escapeHTML(p.dest);
    h += '</div></div>';
    h += '<div style="display:flex;gap:4px;flex-shrink:0">';
    h += '<button class="vb" style="font-size:11px;padding:2px 8px;color:#34C759;border-color:#34C759" onclick="confirmPlan(\'' + id + '\')">✅</button>';
    h += '<button class="vb" style="font-size:11px;padding:2px 8px;color:#FF3B30;border-color:#FF3B30" onclick="deletePlan(\'' + id + '\')">✕</button>';
    h += '</div></div>';
    if (p.note) h += '<div class="pno">💡 ' + escapeHTML(p.note) + '</div>';
    var mv = vs[myName] || '';
    h += '<div class="vg">';
    h += '<button class="vb vby' + (mv === 'yes' ? ' on' : '') + '" onclick="vote(\'' + id + '\',\'yes\')">✅ 可以</button>';
    h += '<button class="vb vbm' + (mv === 'maybe' ? ' on' : '') + '" onclick="vote(\'' + id + '\',\'maybe\')">🤔 再看看</button>';
    h += '<button class="vb vbn' + (mv === 'no' ? ' on' : '') + '" onclick="vote(\'' + id + '\',\'no\')">❌ 不行</button>';
    h += '</div>';
    h += '<div class="bar">';
    if (yes > 0) h += '<div class="bg" style="width:' + (yes / total * 100) + '%"></div>';
    if (maybe > 0) h += '<div class="bo" style="width:' + (maybe / total * 100) + '%"></div>';
    if (no > 0) h += '<div class="br" style="width:' + (no / total * 100) + '%"></div>';
    h += '</div>';
    h += '<div class="vc">✅ ' + yes + ' · 🤔 ' + maybe + ' · ❌ ' + no + ' · 共' + total + '人 · ' + pct + '%可去</div>';
    if (vnames.length > 0) {
      h += '<div>';
      for (var w = 0; w < vnames.length; w++) {
        var nm = vnames[w];
        var x = vs[nm];
        var bg = (x === 'yes' ? '#E8F8ED;color:#1A7D32' : x === 'maybe' ? '#FFF4E5;color:#B87500' : '#FFEDEC;color:#B81C14');
        var icon = (x === 'yes' ? '✅' : x === 'maybe' ? '🤔' : '❌');
        h += '<span class="tag" style="background:' + bg + '">' + icon + ' ' + escapeHTML(nm) + '</span>';
      }
      h += '</div>';
    }
    h += '</div>';
  }
  el.innerHTML = h;
}

var AI_PLANS = [
  { n: '洛阳古都三日游', d: '河南·洛阳', nt: '龙门石窟+白马寺+洛邑古城+老君山，人均800-1200元', tg: ['历史', '文化'] },
  { n: '云台山清凉三日游', d: '河南·焦作', nt: '红石峡+潭瀑峡+茱萸峰，夏季避暑，人均600-1000元', tg: ['自然', '避暑'] },
  { n: '西安古都三日游', d: '陕西·西安', nt: '兵马俑+大唐不夜城+回民街，高铁直达，人均1200-1800元', tg: ['历史', '美食'] },
  { n: '太行大峡谷三日游', d: '河南·安阳', nt: '太行大峡谷+红旗渠+殷墟，壮美山水，人均700-1100元', tg: ['自然', '人文'] },
  { n: '青岛海滨三日游', d: '山东·青岛', nt: '栈桥+崂山+金沙滩+啤酒节，人均1500-2000元', tg: ['海滨', '美食'] },
  { n: '开封东京梦华三日游', d: '河南·开封', nt: '清明上河园+开封府+大相国寺+夜市小吃，人均600-900元', tg: ['文化', '美食'] },

function ar() {
  $('mr').classList.add('on');
  $('rldiv').style.display = 'block';
  $('rrdiv').style.display = 'none';
  setTimeout(function() {
    $('rldiv').style.display = 'none';
    $('rrdiv').style.display = 'block';
    var sh = AI_PLANS.slice().sort(function() { return Math.random() - 0.5; });
    var td = new Date();
    var df = (5 - td.getDay() + 7) % 7 || 7;
    var sd = new Date(td);
    sd.setDate(td.getDate() + df);
    var picks = sh.slice(0, 5).map(function(p, i) {
      var s = new Date(sd); s.setDate(sd.getDate() + i * 7);
      var e = new Date(s); e.setDate(e.getDate() + 2);
      var fmt = function(d) { return d.toISOString().slice(0, 10); };
      return { n: p.n, d: fmt(s), e: fmt(e), dst: p.d, nte: p.nt, tg: p.tg || [] };
    });
    var rh = '';
    for (var i = 0; i < picks.length; i++) {
      var p = picks[i];
      rh += '<div class="plan"><div style="display:flex;justify-content:space-between">';
      rh += '<div><div class="pn">✨ ' + escapeHTML(p.n) + '</div>';
      rh += '<div class="pm">📅 ' + p.d + ' ~ ' + p.e + ' · 📍 ' + escapeHTML(p.dst) + '</div></div>';
      rh += '<button class="vb vby" onclick="addRec(' + i + ')">＋添加</button></div>';
      rh += '<div class="pno" style="margin-top:6px">' + escapeHTML(p.nte) + '</div>';
      rh += '<div style="margin-top:4px">';
      for (var t = 0; t < p.tg.length; t++) { rh += '<span class="rt">#' + p.tg[t] + '</span> '; }
      rh += '</div></div>';
    }
    $('rclist').innerHTML = rh;
    window._recPicks = picks;
  }, 600);
}

function addRec(idx) {
  if (!window._recPicks || !window._recPicks[idx]) return;
  var p = window._recPicks[idx];
  var id = 'p' + Date.now();
  plans[id] = { name: p.n, date: p.d, dateEnd: p.e, dest: p.dst, note: p.nte, createdBy: '🤖 智能推荐', createdAt: Date.now() };
  votes[id] = {};
  renderPlans();
  toast('已添加：' + p.n);
}

function ad() {
  if (!myName) { $('nb').style.display = 'block'; return; }
  var title = $('dt').value.trim();
  if (!title) { toast('请填写标题'); return; }
  var id = 'd' + Date.now();
  itins[id] = { date: $('dd').value, title: title, activities: $('da').value.trim(), createdBy: myName, createdAt: Date.now() };
  $('dd').value = ''; $('dt').value = ''; $('da').value = '';
  cm('md');
  renderItin();
  toast('行程已添加！');
}

function renderItin() {
  var el = $('itin');
  var ids = Object.keys(itins);
  if (ids.length === 0) { el.innerHTML = '<div class="em">🗓️<br><br>还没有行程安排</div>'; return; }
  ids.sort(function(a, b) { return (itins[a].date || '').localeCompare(itins[b].date || ''); });
  var h = '';
  for (var i = 0; i < ids.length; i++) {
    var id = ids[i];
    var d = itins[id];
    h += '<div class="card"><div style="display:flex;justify-content:space-between">';
    h += '<div style="flex:1"><div class="di" style="border:none;padding:0">';
    h += '<div class="dt">' + (d.date ? '📅 ' + d.date : '第' + (i + 1) + '天') + '</div>';
    h += '<div style="font-weight:600;margin:4px 0 8px">' + escapeHTML(d.title) + '</div>';
    if (d.activities) {
      var lines = d.activities.split('\n');
      for (var l = 0; l < lines.length; l++) {
        var line = lines[l].trim();
        if (!line) continue;
        var m = line.match(/^(\d{1,2}:\d{2})\s*(.*)/);
        if (m) { h += '<div class="ar"><div class="at">' + m[1] + '</div><div>' + escapeHTML(m[2]) + '</div></div>'; }
        else { h += '<div class="ar"><div class="at"></div><div>' + escapeHTML(line) + '</div></div>'; }
      }
    } else { h += '<div style="color:#6B7280;font-size:13px">暂无安排</div>'; }
    h += '</div></div>';
    h += '<button class="vb" style="font-size:11px;padding:2px 8px;color:#FF3B30;border-color:#FF3B30;flex-shrink:0;height:fit-content" onclick="deleteDay(\'' + id + '\')">✕</button>';
    h += '</div></div>';
  }
  h += '<button class="btn btn-o" style="margin-top:8px" onclick="clearDays()">🗑️ 清空所有行程</button>';
  el.innerHTML = h;
}

function deleteDay(id) { if (!confirm('确定删除吗？')) return; delete itins[id]; renderItin(); toast('已删除'); }
function clearDays() { if (!confirm('确定清空所有吗？')) return; itins = {}; renderItin(); toast('已清空'); }
