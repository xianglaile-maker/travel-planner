<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>旅行计划 - 实时协作</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #1c1c1e; padding: 0; }
  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 20px; }
  .loading .spinner { width: 40px; height: 40px; border: 4px solid #e5e7eb; border-top-color: #5b7fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { color: #6b7280; font-size: 14px; margin-top: 8px; }
  .loading .title { font-size: 20px; font-weight: 700; color: #5b7fff; margin-bottom: 8px; }
  .error { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 20px; }
  .error .icon { font-size: 48px; margin-bottom: 12px; }
  .error h2 { color: #1c1c1e; margin-bottom: 8px; }
  .error p { color: #6b7280; font-size: 14px; margin-bottom: 16px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 24px; border: none; border-radius: 10px; font-size: 15px; font-weight: 500; background: #5b7fff; color: #fff; cursor: pointer; font-family: inherit; text-decoration: none; }
  .btn:active { opacity: 0.8; }
</style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="title">🗺️ 旅行计划</div>
    <p>正在加载应用...</p>
  </div>
  <div class="error" id="error">
    <div class="icon">😅</div>
    <h2>加载失败</h2>
    <p>请检查网络后刷新页面重试</p>
    <button class="btn" onclick="location.reload()">刷新重试</button>
  </div>

  <!-- Load Firebase via CDN -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyBMdduAkyVSdvz3sXtlB3jAW7L_yhin2VQ",
    authDomain: "travel-planner-2b162.firebaseapp.com",
    databaseURL: "https://travel-planner-2b162-default-rtdb.firebaseio.com",
    projectId: "travel-planner-2b162",
    storageBucket: "travel-planner-2b162.firebasestorage.app",
    messagingSenderId: "20555551861",
    appId: "1:20555551861:web:375a0d4cd15363f7da143c"
  };
  firebase.initializeApp(firebaseConfig);
  window._firebaseDB = firebase.database();

  // Load the app from jsDelivr CDN
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'https://cdn.jsdelivr.net/gh/xianglaile-maker/travel-planner@main/index.html', true);
  xhr.onload = function() {
    if (xhr.status === 200) {
      var html = xhr.responseText;
      // Remove the original HTML head/body - keep only the content
      var parser = new DOMParser();
      var doc = parser.parseFromString(html, 'text/html');
      
      // Merge styles
      var styles = doc.querySelectorAll('style');
      styles.forEach(function(s) {
        document.head.appendChild(s.cloneNode(true));
      });
      
      // Merge meta tags
      var metas = doc.querySelectorAll('meta');
      metas.forEach(function(m) {
        if (!m.getAttribute('charset')) {
          document.head.appendChild(m.cloneNode(true));
        }
      });
      
      // Replace body content
      var newBody = doc.querySelector('body');
      if (newBody) {
        document.body.innerHTML = newBody.innerHTML;
      }
      
      // Execute scripts
      var scripts = doc.querySelectorAll('script');
      scripts.forEach(function(oldScript) {
        if (oldScript.src) {
          var newScript = document.createElement('script');
          newScript.src = oldScript.src;
          document.body.appendChild(newScript);
        } else if (oldScript.textContent.trim()) {
          var newScript = document.createElement('script');
          newScript.textContent = oldScript.textContent;
          document.body.appendChild(newScript);
        }
      });

      // Inject Firebase DB reference into the app's scope
      setTimeout(function() {
        if (typeof db === 'undefined' && window._firebaseDB) {
          window.db = window._firebaseDB;
        }
        // Remove loading
        var loadingEl = document.getElementById('loading');
        if (loadingEl) loadingEl.style.display = 'none';
      }, 500);
    } else {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'flex';
    }
  };
  xhr.onerror = function() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'flex';
  };
  xhr.send();
  </script>
</body>
</html>
